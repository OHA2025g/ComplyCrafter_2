apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: comply-crafter-blue-green
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/comply-crafter
    targetRevision: HEAD
    path: ops/k8s/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: comply-crafter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blue-green-config
  namespace: comply-crafter
data:
  current-environment: "blue"
  traffic-split: "100"
  health-check-interval: "30s"
  rollback-threshold: "5"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comply-crafter-ingress
  namespace: comply-crafter
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      set $blue_green_env "blue";
      if ($http_x_environment = "green") {
        set $blue_green_env "green";
      }
      proxy_pass http://comply-crafter-$blue_green_env;
spec:
  tls:
  - hosts:
    - comply-crafter.your-domain.com
    secretName: comply-crafter-tls
  rules:
  - host: comply-crafter.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: comply-crafter-blue
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: comply-crafter-blue
  namespace: comply-crafter
spec:
  selector:
    app: comply-crafter
    version: blue
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: comply-crafter-green
  namespace: comply-crafter
spec:
  selector:
    app: comply-crafter
    version: green
  ports:
  - port: 80
    targetPort: 8080
