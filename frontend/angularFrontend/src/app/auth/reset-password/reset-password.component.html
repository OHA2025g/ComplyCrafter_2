<div class="reset-password-container">
  <div class="reset-password-card">
    <h1>Reset Password</h1>
    <p *ngIf="token">Enter your new password below.</p>
    <p *ngIf="!token">The password reset link is invalid or has expired.</p>
    
    <div *ngIf="success" class="success-message">
      <span>✓</span>
      Password reset successfully! Redirecting to login...
    </div>

    <form *ngIf="token && !success" (ngSubmit)="submit()" class="reset-password-form">
      <div class="form-group">
        <label for="password">New Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter new password (min 8 characters)"
          minlength="8"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm new password"
          minlength="8"
          required
        />
        <div *ngIf="password !== confirmPassword && confirmPassword" class="error-text">
          Passwords do not match
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="submitting">
        {{ submitting ? 'Resetting...' : 'Reset Password' }}
      </button>

      <div *ngIf="error" class="error-message">
        <span>⚠️</span>
        {{ error }}
      </div>
    </form>

    <div *ngIf="!token" class="back-link">
      <a [routerLink]="['/forgot-password']" class="btn-link">Request New Reset Link</a>
    </div>

    <div *ngIf="token" class="back-link">
      <a [routerLink]="['/login']">← Back to Login</a>
    </div>
  </div>
</div>
