  <path d="M 85 55 Q 45 55, 45 100 Q 45 145, 85 145" 
        stroke="#667eea" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 90 60 Q 50 60, 50 100 Q 50 140, 90 140" 
