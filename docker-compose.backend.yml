version: '3.8'

services:
  # Forms Service (Main Backend API)
  forms:
    build:
      context: .
      dockerfile: services/forms/Dockerfile
    container_name: complycrafter-forms
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --workers 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-comply}:${POSTGRES_PASSWORD:-comply}@${DB_HOST:-db}:5432/${POSTGRES_DB:-comply}
      - PYTHONPATH=/app:/app/libs
      - ENVIRONMENT=production
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379
      - CORS_ORIGINS=${CORS_ORIGINS:-https://menindata.org,https://www.menindata.org,http://localhost:4200}
    ports:
      - "${FORMS_PORT:-8100}:8100"
    volumes:
      - ./services/forms:/app
      - ./libs:/app/libs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: complycrafter-gateway
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-comply}:${POSTGRES_PASSWORD:-comply}@${DB_HOST:-db}:5432/${POSTGRES_DB:-comply}
      - AUTH_ISSUER=${AUTH_ISSUER:-http://keycloak:8080/realms/comply}
      - FORMS_BASE_URL=http://forms:8100
      - PYTHONPATH=/app:/app/libs
      - ENVIRONMENT=production
      - CORS_ORIGINS=${CORS_ORIGINS:-https://menindata.org,https://www.menindata.org,http://localhost:4200}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./services/gateway:/app
      - ./libs:/app/libs
    depends_on:
      - forms
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: complycrafter-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
    driver: local

networks:
  default:
    name: complycrafter-backend-network

