version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: complycrafter-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comply}
      POSTGRES_DB: ${POSTGRES_DB:-comply}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comply}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
    driver: local

networks:
  default:
    name: complycrafter-db-network

