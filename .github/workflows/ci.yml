name: Phase0-CI

on:
  push:
    branches: ["backup-main"]
  pull_request:
    branches: ["backup-main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Test
        run: |
          cd frontend
          npm run test

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, forms, compliance, billing, jobs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install deps
        run: |
          cd services/${{ matrix.service }}
          poetry install --sync
      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          poetry run pytest

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migration CLI summary
        run: python tools/migration_cli/migration_cli/cli.py summary
      - name: Validate docker-compose file exists
        run: test -f ops/docker-compose.yml
